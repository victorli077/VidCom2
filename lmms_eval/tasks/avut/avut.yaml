# AVUT Benchmark - Human-annotated subset.
#
# Dataset: https://huggingface.co/datasets/tsinghua-ee/AVUTBenchmark
# Paper:  https://arxiv.org/abs/2503.19951
#
# Run with:
#   python -m lmms_eval --model qwen2_5_omni --tasks avut

dataset_path: tsinghua-ee/AVUTBenchmark
test_split: train
output_type: generate_until
doc_to_visual: !function utils.avut_doc_to_visual
doc_to_text: !function utils.avut_doc_to_text
doc_to_target: !function utils.avut_doc_to_target
generation_kwargs:
  max_new_tokens: 256
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
process_results: !function utils.avut_process_results
metric_list:
  - metric: avut_score
    aggregation: !function utils.avut_aggregate_results
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "Respond with only the letter (A, B, C, or D) of the best answer."
dataset_kwargs:
  token: true
  cache_dir: AVUTBenchmark
  data_files: AV_Human_data.json
  video: true
  create_link: true
metadata:
  - version: 0.0
task: "avut"
