# LVOmniBench Benchmark - Long Video Multimodal Benchmark
#
# Dataset: https://huggingface.co/datasets/KD-TAO/LVOmniBench
# Paper:   (pending)
#
# Run with:
#   python -m lmms_eval --model qwen2_5_omni --tasks lvomnibench
#   python -m lmms_eval --model qwen2_5_omni --tasks lvomnibench --log_samples

dataset_path: KD-TAO/LVOmniBench
test_split: train
output_type: generate_until
doc_to_visual: !function utils.lvomnibench_doc_to_visual
doc_to_text: !function utils.lvomnibench_doc_to_text
doc_to_target: !function utils.lvomnibench_doc_to_target
generation_kwargs:
  max_new_tokens: 256
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
process_results: !function utils.lvomnibench_process_results
metric_list:
  - metric: lvomnibench_score
    aggregation: !function utils.lvomnibench_aggregate_results
    higher_is_better: true
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "Please respond with only the letter (A, B, C, or D) of the best answer."
dataset_kwargs:
  token: true
  cache_dir: LVOmniBench
  data_files: data.json
  video: true
  create_link: true
metadata:
  - version: 0.0
task: "lvomnibench"
